<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scanner Kupon Zakat</title>
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<style>
:root{--bg:#f3f1ea;--fg:#1c2b24;--card:#fff;--mut:#66736c;--line:#d9d5c8;--ok:#1d7a47;--warn:#b86e00;--bad:#b83227;--btn:#1c4a38}
@media(prefers-color-scheme:dark){:root{--bg:#121815;--fg:#eaf0ec;--card:#1b2420;--mut:#98a79f;--line:#2e3a34;--btn:#3e8a68}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:16px;max-width:480px;margin-inline:auto}
h1{font-size:1.3rem;margin:0 0 4px}
.mut{color:var(--mut);font-size:.9rem}
#stat{margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
input{width:100%;padding:12px;font-size:1rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
button{padding:12px 16px;font-size:1rem;border:0;border-radius:8px;background:var(--btn);color:#fff;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.row{display:flex;gap:8px;margin-top:8px}
#reader{width:100%;border-radius:8px;overflow:hidden}
#hasil{display:none;text-align:center;color:#fff;border-radius:10px;padding:18px;margin:12px 0}
#hasil b{display:block;font-size:1.8rem;line-height:1.2}
#hasil span{font-size:1.1rem;font-variant-numeric:tabular-nums}
#hasil small{display:block;margin-top:6px;font-size:.95rem}
#warn{border-color:var(--bad)}
#warn div div{margin-top:6px}
.BERHASIL,.DIBATALKAN{background:var(--ok)}.SUDAH{background:var(--warn)}.INVALID{background:var(--bad)}.MERIKSA{background:#4a5a52}
</style>
</head>
<body>
<h1>Scanner Kupon Zakat</h1>

<div id="login" class="card">
  <label for="pin">Masukkan PIN petugas</label>
  <input id="pin" type="password" autocomplete="off">
  <div class="row"><button id="btnLogin">Masuk</button></div>
  <p id="err" class="mut"></p>
</div>

<div id="app" hidden>
  <p class="mut" id="info">Menyambung…</p>
  <p class="mut" id="stat"></p>
  <div id="hasil" role="status" aria-live="assertive"></div>
  <div id="warn" class="card" hidden>
    <b>Perlu dicek</b>
    <div id="warnList"></div>
    <div class="row"><button class="alt" id="btnWarn">Tutup</button></div>
  </div>
  <div class="card"><div id="reader"></div></div>
  <div class="card">
    <label for="manual">Ketik kode manual</label>
    <input id="manual" inputmode="numeric" autocomplete="off">
    <div class="row">
      <button id="btnManual">Periksa kode</button>
      <button id="btnUndo" class="alt" hidden>Batalkan pakai</button>
    </div>
  </div>
  <button class="alt" id="btnKeluar">Keluar</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbw0kOibgwGydXLITRCNEcpehhsx0neVj1BeXuetrMB8qFzs2tJsgXZc2GP5Z2q_3dRr7w/exec';   // URL dari Deploy > Web app
const $ = id => document.getElementById(id);
const baca = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? def : v; } catch (e) { return def; } };
const tulis = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const tunggu = ms => new Promise(r => setTimeout(r, ms));

let pin = localStorage.getItem('pin') || '', role = '', nama = '', device = '', ident = '';
let busy = false, last = '', lastT = 0, scanner;
let db = new Map(), siap = false, srv = { total: 0, terpakai: 0 }, ver = '';   // db: kode -> [kode, terpakai, waktu, pemilik, device]
let antre = baca('antre', []), kirimSedang = false, sinkronSedang = false, gen = 0;

// Bangunkan server Apps Script selagi petugas mengetik PIN (menghilangkan cold start saat login)
fetch(API, { mode: 'no-cors' }).catch(() => {});

async function kirim(data, ms) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 20000);
  try {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ pin }, data)), signal: c.signal });
    return await r.json();
  } finally { clearTimeout(t); }
}

function bersih() { ['pin', 'who', 'snap', 'antre'].forEach(k => localStorage.removeItem(k)); }
function keluarPaksa() { bersih(); location.reload(); }

function buka() { $('login').hidden = true; $('app').hidden = false; mulai(); }

async function login(auto) {
  $('err').textContent = '';
  if (!auto) { pin = $('pin').value.trim(); if (!pin) return; $('err').textContent = 'Memeriksa…'; }
  if (auto) buka(); // petugas yang sudah pernah masuk langsung melihat kamera
  try {
    const d = await kirim({ act: 'login' });
    if (!d.ok) {
      if (auto) keluarPaksa(); else $('err').textContent = 'PIN salah.';
      return;
    }
    localStorage.setItem('pin', pin);
    role = d.role; nama = d.nama; device = d.device; srv = d;
    tulis('who', { nama, device, role });
    $('btnUndo').hidden = role !== 'admin';
    ident = nama + ' · ' + device;
    if (!auto) { $('err').textContent = ''; buka(); }
    render(); sinkron(); kirimAntre();
  } catch (e) {
    if (auto) $('info').textContent = (ident || 'Offline') + ' · belum tersambung, mencoba lagi otomatis…';
    else $('err').textContent = 'Gagal terhubung. Periksa internet dan URL API.';
  }
}

// ---------- Data lokal ----------
function hit() { let t = 0; db.forEach(r => { if (r[1]) t++; }); return { total: db.size, terpakai: t }; }

function render() {
  const h = siap ? hit() : srv;
  $('info').textContent = ident + (h.total ? ' · Terpakai ' + h.terpakai + ' dari ' + h.total : ' · Menyambung…');
}

function statusKirim(s) {
  const n = antre.length;
  $('stat').textContent = s === 'gagal' ? 'Offline — ' + n + ' scan tertunda, dikirim otomatis' : n ? 'Menyimpan ' + n + ' scan…' : (siap ? 'Semua scan tersimpan ✓' : '');
}

function terapkan(d) {
  const m = new Map();
  d.forEach(r => { if (!m.has(r[0])) m.set(r[0], r); });
  antre.forEach(x => { // scan yang belum terkirim tetap berlaku di atas data server
    const r = m.get(x.kode);
    if (x.lokal === 'BERHASIL' && r && !r[1]) m.set(x.kode, [x.kode, 1, x.t, nama, device]);
  });
  db = m; siap = true;
}
function simpanSnap() { tulis('snap', { ver, d: Array.from(db.values()) }); }

function ubahLokal(kode, h) {
  if (!siap) return;
  const x = h.hasil;
  if (x === 'BERHASIL') db.set(kode, [kode, 1, Date.now(), nama, device]);
  else if (x === 'SUDAH DIPAKAI') db.set(kode, [kode, 1, h.waktu || 0, h.oleh || '', h.device || '']);
  else if (x === 'DIBATALKAN' || x === 'BELUM TERPAKAI') db.set(kode, [kode, 0]);
  else if (x === 'INVALID') db.delete(kode);
}

// ---------- Tampilan hasil ----------
function tampil(d) {
  const h = $('hasil');
  const map = { 'MERIKSA': ['MERIKSA', 'Memeriksa…'], 'BERHASIL': ['BERHASIL', 'BERHASIL'], 'SUDAH DIPAKAI': ['SUDAH', 'SUDAH DIGUNAKAN'],
    'INVALID': ['INVALID', 'INVALID'], 'DIBATALKAN': ['DIBATALKAN', 'DIBATALKAN'], 'ULANG': ['MERIKSA', 'DATA DIPERBARUI — PINDAI ULANG'] };
  const m = map[d.hasil] || ['INVALID', d.hasil || 'ERROR'];
  h.className = m[0]; h.style.display = 'block';
  h.textContent = '';
  const b = document.createElement('b'), s = document.createElement('span');
  b.textContent = m[1]; s.textContent = d.kode || '';
  h.append(b, s);
  if (d.catatan) { const t = document.createElement('small'); t.textContent = d.catatan; h.append(t); }
  if (navigator.vibrate) navigator.vibrate(d.hasil === 'MERIKSA' ? 40 : d.hasil === 'BERHASIL' ? 120 : [200, 100, 200]);
}

function peringatan(kode, teks) {
  const el = document.createElement('div');
  el.textContent = kode + ' — ' + teks;
  $('warnList').append(el); $('warn').hidden = false;
}

// ---------- Scan ----------
function proses(kode, act) {
  kode = String(kode).trim();
  if (!kode || busy || (kode === last && Date.now() - lastT < 5000)) return;
  last = kode; lastT = Date.now();
  if (act === 'undo' || !siap) return langsung(kode, act);   // belum ada data lokal / pembatalan: tanya server langsung

  busy = true; setTimeout(() => busy = false, 700);
  const r = db.get(kode);
  let lokal, catatan = '';
  if (!r) lokal = 'INVALID';
  else if (r[1]) { lokal = 'SUDAH DIPAKAI'; if (r[3]) catatan = 'oleh ' + r[3]; }
  else { lokal = 'BERHASIL'; db.set(kode, [kode, 1, Date.now(), nama, device]); }
  tampil({ hasil: lokal, kode, catatan });                    // hasil langsung tampil, tanpa menunggu server
  antre.push({ id: uid(), kode, act: 'scan', cek: lokal !== 'BERHASIL', lokal, t: Date.now() });
  tulis('antre', antre); render(); statusKirim('kirim'); kirimAntre();
}

async function langsung(kode, act) {
  busy = true;
  tampil({ hasil: 'MERIKSA', kode });
  try {
    const d = await kirim({ act: act || 'scan', kode });
    if (d.hasil === 'PIN SALAH') return keluarPaksa();
    tampil(d);
    ubahLokal(kode, d);
    if (d.total) srv = d;
    render();
  } catch (e) { tampil({ hasil: 'GAGAL TERHUBUNG', kode }); last = ''; }
  setTimeout(() => busy = false, 1200);
}

// Kirim scan ke server berkelompok. Gagal/offline = diulang otomatis (aman: tiap scan punya id unik).
async function kirimAntre() {
  if (kirimSedang) return;
  kirimSedang = true;
  try {
    while (antre.length) {
      const paket = antre.slice(0, 20);
      try {
        const d = await kirim({ act: 'batch', items: paket.map(x => ({ id: x.id, kode: x.kode, act: x.act, cek: x.cek })) });
        if (d.hasil === 'PIN SALAH') return keluarPaksa();
        if (!d.ok || !d.res) throw new Error(d.hasil || 'gagal');
        antre.splice(0, paket.length); tulis('antre', antre);
        gen++;
        paket.forEach((x, i) => selaraskan(x, d.res[i] || {}));
        srv = d; simpanSnap(); render(); statusKirim('ok');
      } catch (e) { statusKirim('gagal'); await tunggu(3000); }
    }
  } finally { kirimSedang = false; }
  statusKirim('ok');
}

// Bandingkan dugaan lokal dengan keputusan server (server yang berwenang).
function selaraskan(x, h) {
  if (!h.hasil) return;
  const k = x.kode;
  if (h.hasil === x.lokal) { if (h.hasil === 'SUDAH DIPAKAI') ubahLokal(k, h); return; }
  if (x.lokal === 'BERHASIL' && h.hasil === 'SUDAH DIPAKAI' && h.oleh === nama && h.device === device) return; // kiriman ulang milik sendiri
  ubahLokal(k, h);
  if (x.lokal === 'BERHASIL') {
    const teks = h.hasil === 'SUDAH DIPAKAI' ? 'ternyata sudah dipakai' + (h.oleh ? ' oleh ' + h.oleh : '') + ' — jangan diberikan / tarik kembali' : 'kode tidak ditemukan di server';
    peringatan(k, teks);
    tampil({ hasil: h.hasil, kode: k, catatan: 'DITOLAK SERVER' });
  } else if (h.hasil === 'BELUM TERPAKAI') {
    tampil({ hasil: 'ULANG', kode: k });
  } else {
    tampil({ hasil: h.hasil, kode: k, catatan: h.oleh ? 'oleh ' + h.oleh : '' });
  }
}

// ---------- Sinkron berkala (juga menjaga server tetap "hangat") ----------
async function sinkron() {
  if (sinkronSedang || kirimSedang || document.hidden || !pin || $('app').hidden) return;
  sinkronSedang = true;
  const g = gen;
  try {
    const d = await kirim({ act: 'sinkron', ver }, 30000);
    if (d.hasil === 'PIN SALAH') return keluarPaksa();
    if (d.ok && g === gen && !kirimSedang) {
      if (!d.same) { ver = d.ver || ''; terapkan(d.daftar); simpanSnap(); }
      render(); statusKirim('ok');
    }
  } catch (e) {
  } finally { sinkronSedang = false; }
}

function mulai() {
  if (scanner) return;
  scanner = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE, Html5QrcodeSupportedFormats.CODE_128],
    useBarCodeDetectorIfSupported: true,                     // dekoder bawaan browser (lebih cepat) bila tersedia
    experimentalFeatures: { useBarCodeDetectorIfSupported: true }
  });
  scanner.start({ facingMode: 'environment' }, {
    fps: 15, aspectRatio: 1, disableFlip: true,
    qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; }
  }, txt => proses(txt), () => {}).catch(() => { $('reader').textContent = 'Kamera tidak bisa dibuka. Izinkan akses kamera.'; });
}

$('btnLogin').onclick = () => login(false);
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') login(false); });
$('btnManual').onclick = () => { proses($('manual').value); $('manual').value = ''; };
$('btnUndo').onclick = () => { last = ''; proses($('manual').value, 'undo'); $('manual').value = ''; };
$('btnWarn').onclick = () => { $('warn').hidden = true; $('warnList').textContent = ''; };
$('btnKeluar').onclick = () => {
  if (antre.length && !confirm(antre.length + ' scan belum terkirim akan hilang. Tetap keluar?')) return;
  keluarPaksa();
};
document.addEventListener('visibilitychange', () => { if (!document.hidden) { sinkron(); kirimAntre(); } });
setInterval(() => { sinkron(); kirimAntre(); }, 10000);

if (pin) {
  const w = baca('who', null), sn = baca('snap', null);
  if (w) {
    nama = w.nama; device = w.device; role = w.role; ident = nama + ' · ' + device;
    $('btnUndo').hidden = role !== 'admin';
    if (sn && sn.d) { ver = sn.ver || ''; terapkan(sn.d); render(); statusKirim('ok'); } // scan langsung bisa dipakai, bahkan sebelum login selesai
  }
  login(true);
}
</script>
</body>
</html>
